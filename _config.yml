# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: ""
locale: "fi_FI"
lang: "fi"
url: "https://lentotahti.fi"
logo: "/assets/images/logos/lentotahti-logo-punainen.svg"
email: lentotahti@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Polkujuoksuvalmennusta, juoksuvalmennusta ja luontoliikuntaa Espoossa ja Ylivieskassa. Yksilölliset treeniohjelmat, etävalmennus ja yhteistreenit kaiken tasoisille liikkujille.
github_username: joonasky
minimal_mistakes_skin: lentotahti
search: true

social:
  type: Organization
  name: "Lentotähti"
  links:
    - "https://www.instagram.com/tmi.lentotahti/"
    - "https://www.instagram.com/miratms/"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Mira Kylliäinen"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Polkujuoksija<br />Liikuntaneuvoja (AT)<br />Personal Trainer<br />FM Biologia"
  links:
    - label: "Lentotähden Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/tmi.lentotahti/"
    - label: "Miran Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/miratms/"
    

footer:
  links:
    - label: "Lentotähden Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/tmi.lentotahti/"
    - label: "Miran Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/miratms/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _hinnasto
  - scope:
      path: ""
      type: hinnasto
    values:
      layout: single
      author_profile: false
      share: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Collections
collections:
  hinnasto:
    output: true
    permalink: /:collection/:path/